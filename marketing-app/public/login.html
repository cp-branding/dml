<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing-Kurs · Login</title>
<link rel="icon" type="image/png" href="/dml_favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Fraunces:wght@400;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent: #4A6CF7;
  --accent2: #7C3AED;
  --text: #1a1a2e;
  --muted: #6b7280;
  --light: #9ca3af;
  --border: rgba(200,210,240,0.5);
  --glass: rgba(255,255,255,0.75);
  --radius: 18px;
  --radius-sm: 11px;
}

body {
  font-family: 'Inter', sans-serif;
  background: linear-gradient(145deg, #e8eeff 0%, #f3e8ff 50%, #e8f4ff 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  color: var(--text);
}

body::before {
  content: '';
  position: fixed;
  top: -20%; left: -10%;
  width: 55%; height: 55%;
  background: radial-gradient(circle, rgba(74,108,247,0.12) 0%, transparent 65%);
  pointer-events: none;
}
body::after {
  content: '';
  position: fixed;
  bottom: -20%; right: -10%;
  width: 45%; height: 45%;
  background: radial-gradient(circle, rgba(124,58,237,0.10) 0%, transparent 65%);
  pointer-events: none;
}

.card {
  background: var(--glass);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.9);
  border-radius: var(--radius);
  padding: 44px 40px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 8px 40px rgba(74,108,247,0.12);
  position: relative;
  z-index: 1;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 32px;
}

.logo-mark {
  width: 42px;
  height: 42px;
  border-radius: 11px;
  overflow: hidden;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.logo-mark img {
  width: 42px;
  height: 42px;
  object-fit: cover;
  border-radius: 11px;
}

.logo-wordmark {
  height: 38px;
  width: auto;
  filter: brightness(0);
}

.heading {
  font-family: 'Fraunces', serif;
  font-size: 24px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}

.subheading {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 28px;
  line-height: 1.5;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

input[type="email"],
input[type="password"] {
  width: 100%;
  background: rgba(255,255,255,0.85);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 13px 16px;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  margin-bottom: 16px;
  letter-spacing: 0.1em;
}

input[type="email"]:focus,
input[type="password"]:focus {
  border-color: rgba(74,108,247,0.45);
  box-shadow: 0 0 0 3px rgba(74,108,247,0.08);
}

input[type="email"]::placeholder,
input[type="password"]::placeholder {
  color: var(--light);
  letter-spacing: 0.02em;
}

button[type="submit"] {
  width: 100%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  padding: 13px;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  letter-spacing: 0.02em;
}

button[type="submit"]:hover { opacity: 0.92; }
button[type="submit"]:active { transform: scale(0.98); }
button[type="submit"]:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.error {
  display: none;
  background: rgba(220,38,38,0.07);
  border: 1px solid rgba(220,38,38,0.2);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 13px;
  color: #dc2626;
  margin-top: 12px;
  line-height: 1.5;
}

.error.show { display: block; }

.footer-note {
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--light);
  text-align: center;
  line-height: 1.6;
}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-mark">
      <img src="/dml_favicon.png" alt="DML">
    </div>
    <img src="/dml_wordmark.png" alt="Marketing-Kurs" class="logo-wordmark">
  </div>

  <h2 class="heading">Moin.</h2>
  <p class="subheading">Email und Kurs-Passwort — dann geht's los.</p>

  <form id="loginForm">
    <label for="email">Email</label>
    <input
      type="email"
      id="email"
      placeholder="du@beispiel.de"
      autocomplete="email"
      autofocus
    />
    <label for="password">Passwort</label>
    <input
      type="password"
      id="password"
      placeholder="••••••••"
      autocomplete="current-password"
    />
    <button type="submit" id="submitBtn">Rein →</button>
    <div class="error" id="errorMsg">Email oder Passwort falsch. Nochmal.</div>
  </form>

  <p class="footer-note">Du hast kein Passwort?<br>Meld dich bei Constantin.</p>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('errorMsg');
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('password').value;

  // Basic email validation
  if (!email || !email.includes('@')) {
    err.textContent = 'Bitte eine gültige Email eingeben.';
    err.classList.add('show');
    document.getElementById('email').focus();
    return;
  }

  btn.disabled = true;
  btn.textContent = '...';
  err.classList.remove('show');

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw })
    });

    if (res.ok) {
      window.location.href = '/';
    } else {
      err.textContent = 'Email oder Passwort falsch. Nochmal.';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Rein →';
      document.getElementById('password').focus();
    }
  } catch {
    err.textContent = 'Verbindungsfehler. Kurz warten und nochmal.';
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Rein →';
  }
});
</script>
</body>
</html>
